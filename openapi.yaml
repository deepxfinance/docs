openapi: 3.2.0
info:
  title: DeepX API
  version: 1.1.0
  description: >
    DeepX Public API V1.


    ## Changelog


    **v1.0.0 (2026-03-24)**


    - Initial release


    ## General API Information


    - **Time Format**: All timestamps are in milliseconds (ms) by default. 

    - **Data Order**: Data is returned in chronological order, unless noted
    otherwise. Here is how the `startTime` and `endTime` parameters work:
      * Without `startTime` or `endTime`, returns the most recent items up to the `limit`.
      * With `startTime`, returns oldest items from `startTime` up to the `limit`.
      * With `endTime`, returns most recent items up to `endTime` and the `limit`.
      * With both, behaves like `startTime` but does not exceed `endTime`.
    - **Pagination**: Historical data is paginated using `cursor` and `limit`.
    All paginated responses include `nextCursor` and `hasNext` metadata:
      * `nextCursor`: The ID of the oldest record in the current page. Pass this as `cursor` in the next request to fetch the next (older) page. `null` when there are no more records.
      * `hasNext`: `true` if more records are available beyond the current page. Stop paginating when `hasNext` is `false` (equivalent to the returned array length being `< limit`).
      * When combining with `startTime`/`endTime`, all three filters apply together:
        - With `cursor` and `endTime`, returns items after `cursor` and before `endTime` up to the `limit`.
        - With `cursor` and `startTime`, returns items after `cursor` and after `startTime` up to the `limit`.
        - With `cursor`, `startTime`, and `endTime`, returns items after `cursor` and between `startTime` and `endTime` up to the `limit`.
      * When `cursor` points to a record earlier than `startTime`, all candidate records fall before the time window. The response returns an empty `items` array with `nextCursor: null` and `hasNext: false`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://fa1356g-api.deepx.fi/v1
    description: Devnet Server
tags:
  - name: System
    description: Connectivity, server health, and server time.
  - name: Spot Markets
    description: Public market data for Spot pairs (tickers, depth, trades).
  - name: Perp Markets
    description: Public market data for Perpetual contracts (tickers, funding rates, etc.).
  - name: Account
    description: Account data (wallets, subaccounts, orders, trades, positions).
  - name: Lending Markets
    description: Lending and borrowing market parameters and real-time data.
paths:
  /v1/ping:
    get:
      tags:
        - System
      security: []
      summary: Test Connectivity
      description: Test connectivity to the REST API.
      operationId: ping
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/time:
    get:
      tags:
        - System
      security: []
      summary: Get Server Time
      description: Returns the current server time.
      operationId: getServerTime
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - serverTime
                properties:
                  serverTime:
                    $ref: '#/components/schemas/Timestamp'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/wallets/{address}/subaccounts:
    get:
      tags:
        - Account
      summary: List Wallet Subaccounts
      security: []
      description: >-
        Retrieves a list of subaccount addresses associated with a primary
        wallet address.
      operationId: getAccountSubaccounts
      parameters:
        - name: address
          in: path
          required: true
          description: Primary wallet address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
      responses:
        '200':
          description: A list of subaccount addresses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvmAddress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/wallets/{address}/one-click-trading-accounts:
    get:
      tags:
        - Account
      summary: List One-Click Trading Accounts
      security: []
      description: >-
        Retrieves a list of session-key (One-Click Trading) accounts linked to a
        primary wallet address.
      operationId: getOneClickTradingAccounts
      parameters:
        - name: address
          in: path
          required: true
          description: Primary wallet address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
      responses:
        '200':
          description: A list of session-key account addresses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvmAddress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/info:
    get:
      tags:
        - Account
      summary: Get Subaccount Info
      security: []
      description: >-
        Retrieves profile information (owner, name) for a specific subaccount
        address.
      operationId: getSubaccountInfo
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
      responses:
        '200':
          description: The subaccount profile information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/portfolio:
    get:
      tags:
        - Account
      summary: Get Subaccount Portfolio
      security: []
      description: >-
        Retrieves a unified portfolio summary for a subaccount, including net
        account value, deposit/borrow totals, collateral, and risk metrics.
      operationId: getSubaccountPortfolio
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
      responses:
        '200':
          description: The subaccount's portfolio summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPortfolio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/stats/margin-ratio:
    get:
      tags:
        - Account
      summary: Get Subaccount Margin Ratio
      security: []
      description: >
        Retrieves the Unified Maintenance Margin Ratio (uniMMR) for a specific
        subaccount. This ratio represents the subaccount's health by comparing
        Total Collateral Value to  the Maintenance Margin Requirement.
      operationId: getSubaccountMarginRatio
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
      responses:
        '200':
          description: The subaccount's margin ratio stats.
          content:
            application/json:
              schema:
                type: object
                required:
                  - uniMMR
                properties:
                  uniMMR:
                    type: string
                    format: decimal
                    description: Unified Maintenance Margin Ratio (Collateral Ratio).
                    example: '1.42'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/perp/positions:
    get:
      tags:
        - Account
      summary: Get Subaccount Open Positions
      security: []
      description: >-
        Retrieves the current active perpetual positions for a specific
        subaccount.
      operationId: getPerpPositions
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
        - $ref: '#/components/parameters/PerpSymbolFilter'
      responses:
        '200':
          description: A list of active perpetual positions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerpPosition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/perp/positions/history:
    get:
      tags:
        - Account
      summary: Get Subaccount Position History
      security: []
      description: >-
        Retrieves historical (closed) perpetual position records for a specific
        subaccount.
      operationId: getPerpPositionsHistory
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
        - $ref: '#/components/parameters/PerpSymbolFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
      responses:
        '200':
          description: A list of historical perpetual positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPagination'
                properties:
                  items:
                    items:
                      $ref: ../../schemas/PerpPositionHistory.yaml
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/perp/orders:
    get:
      tags:
        - Account
      summary: Get Subaccount Perpetual Order History
      security: []
      description: Retrieves historical perpetual order records for a specific subaccount.
      operationId: getPerpOrders
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
        - $ref: '#/components/parameters/PerpSymbolFilter'
        - name: side
          in: query
          required: false
          description: Filter by order side.
          schema:
            $ref: '#/components/schemas/OrderSide'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A list of perpetual orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPagination'
                properties:
                  items:
                    items:
                      $ref: ../../schemas/PerpOrder.yaml
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/perp/orders/open:
    get:
      tags:
        - Account
      summary: Get Subaccount Open Perpetual Orders
      security: []
      description: Retrieves currently open perpetual orders for a specific subaccount.
      operationId: getPerpOpenOrders
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
        - $ref: '#/components/parameters/PerpSymbolFilter'
      responses:
        '200':
          description: A list of open perpetual orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerpOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/perp/trades:
    get:
      tags:
        - Account
      summary: Get Subaccount Perpetual Trade History
      security: []
      description: Retrieves historical perpetual trade fills for a specific subaccount.
      operationId: getPerpTrades
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
        - $ref: '#/components/parameters/PerpSymbolFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
      responses:
        '200':
          description: A list of perpetual trade fills.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPagination'
                properties:
                  items:
                    items:
                      $ref: ../../schemas/AccountPerpTrade.yaml
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/perp/funding-payments:
    get:
      tags:
        - Account
      summary: Get Subaccount Funding Payments
      security: []
      description: >-
        Retrieves historical perpetual funding payment records for a specific
        subaccount address.
      operationId: getPerpFundingPayments
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
        - $ref: '#/components/parameters/PerpSymbolFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
      responses:
        '200':
          description: A list of funding payment records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FundingPayment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/spot/orders:
    get:
      tags:
        - Account
      summary: Get Subaccount Spot Order History
      security: []
      description: Retrieves historical spot order records for a specific subaccount.
      operationId: getSpotOrders
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
        - $ref: '#/components/parameters/SpotSymbolFilter'
        - name: side
          in: query
          required: false
          description: Filter by order side.
          schema:
            $ref: '#/components/schemas/OrderSide'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A list of spot orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPagination'
                properties:
                  items:
                    items:
                      $ref: ../../schemas/SpotOrder.yaml
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/spot/orders/open:
    get:
      tags:
        - Account
      summary: Get Subaccount Open Spot Orders
      security: []
      description: Retrieves currently open spot orders for a specific subaccount.
      operationId: getSpotOpenOrders
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
        - $ref: '#/components/parameters/SpotSymbolFilter'
      responses:
        '200':
          description: List of currently open spot orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpotOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/spot/trades:
    get:
      tags:
        - Account
      summary: Get Subaccount Spot Trade History
      security: []
      description: Retrieves historical spot trade fills for a specific subaccount.
      operationId: getSpotTrades
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
        - $ref: '#/components/parameters/SpotSymbolFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A list of spot trade fills.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPagination'
                properties:
                  items:
                    items:
                      $ref: ../../schemas/AccountSpotTrade.yaml
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/balances:
    get:
      tags:
        - Account
      summary: Get Subaccount Balances
      security: []
      description: Retrieves the current net balance of every asset held in a subaccount.
      operationId: getSubaccountBalances
      parameters:
        - name: address
          in: path
          required: true
          description: The subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
      responses:
        '200':
          description: >-
            Array of per-asset balances. Negative balance means the subaccount
            owes that asset.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountBalance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/balance-events:
    get:
      tags:
        - Account
      summary: List Balance Changes
      security: []
      description: >
        Retrieves a paginated log of all balance-affecting events for a
        subaccount, across all assets. Each record includes the signed delta,
        the post-event balance, and the event category (deposit, borrow,
        settlement, etc.).
      operationId: listSubaccountBalanceEvents
      parameters:
        - name: address
          in: path
          required: true
          description: The subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
        - $ref: '#/components/parameters/Cursor'
        - name: changeType
          in: query
          required: false
          description: >-
            Comma-separated list of change types to filter by. If omitted, all
            types are returned.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/BalanceChangeType'
            example:
              - DEPOSIT
              - WITHDRAW
      responses:
        '200':
          description: A list of balance change events, sorted newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPagination'
                properties:
                  items:
                    items:
                      $ref: ../../schemas/BalanceEvent.yaml
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/liquidations:
    get:
      tags:
        - Account
      summary: List Subaccount Liquidation Records
      security: []
      description: >
        Retrieves a paginated log of all liquidation events for a subaccount,
        including both perp and spot liquidations and bankruptcies. Supports
        optional filtering by liquidator, liquidation type, and symbol.
      operationId: listSubaccountLiquidations
      parameters:
        - name: address
          in: path
          required: true
          description: The subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
        - name: liquidator
          in: query
          required: false
          description: Filter by liquidator subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
        - name: liquidationType
          in: query
          required: false
          description: Filter by liquidation type.
          schema:
            $ref: '#/components/schemas/LiquidationType'
        - name: symbol
          in: query
          required: false
          description: Filter by market symbol.
          schema:
            type: string
            example: BTC-USDC
      responses:
        '200':
          description: A list of liquidation records, sorted newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPagination'
                properties:
                  items:
                    items:
                      $ref: ../../schemas/LiquidationRecord.yaml
                  nextCursor:
                    oneOf:
                      - type: string
                        description: >-
                          Cursor for the next page of results. Pass as `cursor`
                          in the next request.
                        example: MTc0NjAwMDAwMDAwMDo3MjY2MzM2OjM6MTIz
                      - type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/perp/orders/tx/{txHash}:
    get:
      tags:
        - Account
      summary: Get Perpetual Order by Transaction Hash
      security: []
      description: >
        Retrieves a specific perpetual order record using its on-chain
        transaction hash.
      operationId: getPerpOrderByTx
      parameters:
        - name: txHash
          in: path
          required: true
          description: The on-chain transaction hash of the order.
          schema:
            $ref: '#/components/schemas/EvmTxHash'
      responses:
        '200':
          description: The requested perpetual order record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerpOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/spot/orders/tx/{txHash}:
    get:
      tags:
        - Account
      summary: Get Spot Order by Transaction Hash
      security: []
      description: >
        Retrieves a specific spot order record using its on-chain transaction
        hash.
      operationId: getSpotOrderByTx
      parameters:
        - name: txHash
          in: path
          required: true
          description: The on-chain transaction hash of the order.
          schema:
            $ref: '#/components/schemas/EvmTxHash'
      responses:
        '200':
          description: The requested spot order record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/perp/orders/{orderId}:
    get:
      tags:
        - Account
      summary: Get Perpetual Order by ID
      security: []
      description: >
        Retrieves a specific perpetual order record by its V1 indexer-assigned
        order ID within a subaccount.
      operationId: getPerpOrderById
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
            $ref: '#/components/schemas/EvmAddress'
        - name: orderId
          in: path
          required: true
          description: The V1 indexer-assigned order ID. Unique per subaccount.
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: The requested perpetual order record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerpOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account/subaccounts/{address}/spot/orders/{orderId}:
    get:
      tags:
        - Account
      summary: Get Spot Order by ID
      security: []
      description: >
        Retrieves a specific spot order record by its V1 indexer-assigned order
        ID within a subaccount.
      operationId: getSpotOrderById
      parameters:
        - name: address
          in: path
          required: true
          description: The specific subaccount address.
          schema:
